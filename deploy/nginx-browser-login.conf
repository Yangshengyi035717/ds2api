# Browser-login view proxy. Keep this block inside the dsapi.ysyun.xyz
# server{} that already terminates TLS (or is behind Cloudflare).
#
# The user must first exchange a short-lived view token at
# /browser-login/view; that endpoint sets an HttpOnly cookie. Every noVNC
# asset/WebSocket request is checked through DS2API before proxying.
#
# Prerequisite (http{} level, once):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# This build of Nginx (BT panel 1.21.4) has neither
# ngx_http_auth_request_module nor working ngx.location.capture() over
# HTTP/2. The view token is therefore `exp.hmac_sha1_hex(secret, exp)`, and
# Nginx verifies it locally with ngx.hmac_sha1. No subrequest is involved.
#
# The shared secret is read from:
#   /www/server/nginx/conf/browser-login.secret
# Keep it identical to BROWSER_LOGIN_SHARED_SECRET in the project .env.

# Token exchange lives on DS2API, not on noVNC. Without this exact match the
# request would fall through to the noVNC proxy below.
location = /browser-login/view {
    proxy_pass http://127.0.0.1:3011/browser-login/view;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /browser-login/websockify {
    access_by_lua_file /www/server/nginx/conf/browser-login.lua;

    rewrite ^/browser-login/websockify.*$ / break;
    proxy_pass http://127.0.0.1:6080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /browser-login/ {
    access_by_lua_file /www/server/nginx/conf/browser-login.lua;

    # The UI requests /browser-login/vnc.html. websockify's --web root is
    # /usr/share/novnc, whose entrypoint lives at /vnc.html, so rewrite the
    # public prefix before proxying.
    rewrite ^/browser-login/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:6080;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # noVNC uses a WebSocket upgrade on this path.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # The noVNC page is same-origin and must be frameable by the WebUI.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options SAMEORIGIN always;
}
